name: CI

env:
  CARBON_MEM_DISABLE: 1

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run once per month, to test whether updated packages from Atmel/Microchip break us.
    - cron:  '0 0 1 * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install needed packages
        run: |
          sudo apt install libxml2-utils libxml2-dev avr-libc gcc-avr luajit castxml luarocks
          luarocks install --local xmlua
      - name: Download packs
        run: ./configure
      - name: Run tests
        run: |
          eval `luarocks path`
          make && make test
